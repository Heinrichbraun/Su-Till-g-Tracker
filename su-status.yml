name: SU status tracker

on:
  schedule:
    # Tidspunkter er i UTC (GitHub Actions understøtter ikke tidszoner i cron).
    # Disse tidspunkter rammer tirsdag kl. 20:00 og onsdag kl. 08:00 dansk
    # SOMMERTID (UTC+2). Om vinteren (UTC+1) rammer de en time senere lokalt,
    # dvs. kl. 21:00 og 09:00 dansk tid. Se README for hvordan du evt. retter
    # det til, når klokken stilles om i slut-oktober / slut-marts.
    - cron: "0 18 * * 2"   # tirsdag 20:00 (sommertid) / 21:00 (vintertid)
    - cron: "0 6 * * 3"    # onsdag 08:00 (sommertid) / 09:00 (vintertid)
  workflow_dispatch: {}    # gør det muligt selv at trykke "Run workflow" for at teste

jobs:
  log-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installer afhængigheder
        run: pip install requests beautifulsoup4

      - name: Kør scriptet
        run: python su_status_tracker.py

      - name: Gem log og snapshots i repoet
        run: |
          git config user.name "su-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add su_status_log.csv snapshots/
          git commit -m "Opdater su-status log $(date -u +%Y-%m-%d_%H:%M)" || echo "Ingen ændringer at gemme"
          git push
